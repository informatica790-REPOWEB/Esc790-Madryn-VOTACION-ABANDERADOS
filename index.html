<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>- ESCUELA N° 790 - "21 DE ENERO" - Elección de Abanderados 2027</title>
  <link rel="icon" href="https://drive.google.com/thumbnail?id=1cNzPNys1uH9fpHmaVtzZ3rKVH7LiBr5j&sz=w1000" type="image/png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; height: 100%; background: #f1f5f9; color: #1e293b; overflow: hidden; }
    .loader-wrap {
      position: fixed; inset: 0; z-index: 20;
      background: #f1f5f9;
      display: flex; align-items: center; justify-content: center; padding: 1.25rem;
    }
    .card {
      background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px;
      padding: 2rem 1.5rem; max-width: 440px; width: 100%; text-align: center;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .logo { max-width: 80px; height: auto; margin: 0 auto 12px; display: block; }
    h1 { color: #0056b3; font-size: 18px; font-weight: 900; text-transform: uppercase; line-height: 1.25; }
    .subtitle { color: #475569; font-size: 14px; font-weight: 600; margin-top: 4px; margin-bottom: 18px; }
    .spinner {
      width: 42px; height: 42px; border: 4px solid #e2e8f0; border-top-color: #0056b3;
      border-radius: 50%; margin: 0 auto 14px; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .substatus { font-size: 12px; color: #64748b; margin-bottom: 18px; }
    .btn {
      display: inline-block; width: 100%; padding: 12px 16px; border-radius: 8px;
      background: #0056b3; color: #ffffff; font-size: 14px; font-weight: 700;
      text-decoration: none; text-transform: uppercase;
    }
    .btn:hover { background: #004494; }
    .footer { margin-top: 14px; font-size: 11px; color: #64748b; }
    iframe.vote-frame {
      position: fixed; inset: 0; width: 100%; height: 100%; border: none; z-index: 10; background: #f1f5f9;
    }
  </style>
</head>
<body>
  <div id="loader" class="loader-wrap">
    <div class="card">
      <img src="https://drive.google.com/thumbnail?id=1cNzPNys1uH9fpHmaVtzZ3rKVH7LiBr5j&sz=w1000" alt="Escudo" class="logo">
      <h1>- ESCUELA N° 790 - "21 DE ENERO"</h1>
      <p class="subtitle">Elección de Abanderados 2027</p>
      <div class="spinner"></div>
      <div id="statusText" class="status">Conectando con la urna digital...</div>
      <div id="subText" class="substatus">Estableciendo conexión segura HTTPS</div>
      <a id="directBtn" href="https://sistema-reservas-790-7288212040.us-central1.run.app/eleccion-votar?school=790" class="btn">Ingresar a Votar Ahora</a>
      <div class="footer">🔒 Enlace oficial • Puerto Madryn, Chubut</div>
    </div>
  </div>
  <iframe id="voteFrame" class="vote-frame" title="Elección de Abanderados 2027" allow="clipboard-write" style="display:none;"></iframe>
  <script>
    (function () {
      var TARGET_VOTE_URL = "https://sistema-reservas-790-7288212040.us-central1.run.app/eleccion-votar?school=790";
      var HEALTH_URL = "https://sistema-reservas-790-7288212040.us-central1.run.app/api/health";
      var EMBED_MODE = true;
      var params = new URLSearchParams(window.location.search);
      if (params.get('redirect') === '1') EMBED_MODE = false;

      var frame = document.getElementById('voteFrame');
      var loader = document.getElementById('loader');
      var statusText = document.getElementById('statusText');
      var subText = document.getElementById('subText');
      var directBtn = document.getElementById('directBtn');
      var launched = false;
      var blockedByOldBackend = false;

      function launchVoting() {
        if (launched || blockedByOldBackend) return;
        launched = true;
        if (!EMBED_MODE) {
          window.location.replace(TARGET_VOTE_URL);
          return;
        }
        frame.src = TARGET_VOTE_URL;
        frame.style.display = 'block';
        frame.onload = function () {
          loader.style.display = 'none';
        };
        setTimeout(function () {
          loader.style.display = 'none';
        }, 2500);
      }

      fetch(HEALTH_URL, { method: 'GET', cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('health_http_' + res.status);
          return res.json().catch(function () { return {}; });
        })
        .then(function (data) {
          if (data && data.eleccionVotar === true) {
            statusText.textContent = '¡Conexión verificada!';
            subText.textContent = 'Abriendo boleta única digital...';
            launchVoting();
          } else {
            blockedByOldBackend = true;
            var spinner = document.querySelector('.spinner');
            if (spinner) spinner.style.display = 'none';
            statusText.style.color = '#b91c1c';
            statusText.textContent = 'Falta actualizar el servidor Cloud Run';
            subText.textContent = 'El servidor destino todavía tiene una versión anterior sin /eleccion-votar (por eso redirigía al Login de Reservas). Subí los cambios y ejecutá ./deploy.sh en sistema-reservas-790.';
            directBtn.textContent = 'Reintentar Conexión';
            directBtn.href = window.location.href;
            directBtn.onclick = function (e) {
              e.preventDefault();
              window.location.reload();
            };
          }
        })
        .catch(function () {
          statusText.textContent = 'Despertando sistema electoral...';
          subText.textContent = 'Aguardá un instante';
          setTimeout(launchVoting, 1800);
        });

      setTimeout(function () {
        if (!blockedByOldBackend) launchVoting();
      }, 4500);
    })();
  </script>
</body>
</html>
